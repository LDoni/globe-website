name: Deploy public Shiny monitoring
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: vars.SHINY_DEPLOY_ENABLED == 'true' && vars.SHINY_ACCOUNT_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: shiny-production
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - run: Rscript R/bootstrap.R
      - run: Rscript tests/testthat.R && Rscript R/prepare_shiny_cache.R
      - run: python3 tests/shiny-startup.py
      - name: Deploy public cache-only application
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: Rscript R/deploy_shiny.R
