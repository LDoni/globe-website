name: Validate and deploy public website
on:
  push:
    branches: [main]
    paths-ignore:
      - 'partners-portal/**'
      - 'scripts/*partner*'
      - 'tests/partners-*'
      - 'tests/portal-*'
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.gitignore'
      - 'README.md'
      - 'STATUS.md'
      - '.github/workflows/partners-portal.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: globo-public-deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - run: Rscript R/bootstrap.R
      - run: bash scripts/ci-check.sh
      - run: python3 -m venv .venv && .venv/bin/pip install -r requirements-test.txt && .venv/bin/python -m playwright install --with-deps chromium
      - name: Browser checks
        run: |
          python3 -m http.server 8765 --directory _site > /tmp/globo-http.log 2>&1 &
          .venv/bin/python tests/browser.py
          GLOBO_SHINY_BROWSER=true .venv/bin/python tests/shiny-startup.py
      - uses: actions/upload-artifact@v4
        with:
          name: globo-public-site
          path: _site/
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-renv-lock
          path: renv.lock
  deploy:
    needs: build
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: globo-public-site
          path: _site
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=globe-ocean --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
