name: Validate pull request
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - run: Rscript R/bootstrap.R
      - run: bash scripts/ci-check.sh
      - run: python3 -m venv .venv && .venv/bin/pip install -r requirements-test.txt && .venv/bin/python -m playwright install --with-deps chromium
      - name: Browser checks
        run: |
          python3 -m http.server 8765 --directory _site > /tmp/globo-http.log 2>&1 &
          .venv/bin/python tests/browser.py
          GLOBO_SHINY_BROWSER=true .venv/bin/python tests/shiny-startup.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: globo-validation
          path: |
            renv.lock
            test-results/
            _site/
