name = "globo-contact"
main = "index.mjs"
compatibility_date = "2026-11-19"
workers_dev = true
[vars]
CONTACT_ALLOWED_ORIGIN = "https://globe-ocean.github.io"
CONTACT_TURNSTILE_HOSTNAME = "globe-ocean.github.io"
CONTACT_ENABLED = "false"
# Bind GLOBE_ENQUIRIES to the existing production workspace KV in an external deployment configuration.
# TURNSTILE_SECRET_KEY is a Cloudflare secret. Never put it in this file.

# Email activation requires CONTACT_MAIL_FROM, CONTACT_MAIL_TO and MAIL_TRANSPORT.
# Cloudflare transport: SEND_EMAIL binding to a fixed verified destination; owned sender domain.
# Gmail transport: GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN as Cloudflare secrets.
